name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  PYTHON_TELEMETRY_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pikahttp-deps"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools maturin

      - name: Build and install pikahttp
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          maturin build --release
          pip install target/wheels/*.whl
          pip install pytest black ruff  # install dev tools
          
      # - name: Check Python formatting
      #   run: |
      #     source .venv/bin/activate
      #     black --check .
      #     ruff check .

      # - name: Check Rust formatting
      #   run: cargo fmt --all -- --check

      # - name: Run clippy
      #   run: cargo clippy -- -D warnings

      - name: Security audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  benchmark:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pikahttp-deps"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel maturin requests

      - name: Build and install pikahttp
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install requests
          maturin build --release
          pip install target/wheels/*.whl

      - name: Run benchmark
        run: |
          source .venv/bin/activate
          python benchmark.py
