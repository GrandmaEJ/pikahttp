name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Limit concurrent runs of this workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  PYTHON_TELEMETRY_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Set reasonable timeout
    strategy:
      fail-fast: false  # Continue with other versions if one fails
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Minimal history for efficient clone
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'  # Cache pip dependencies
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "pikahttp-deps"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip install maturin pytest requests
        pip install -r requirements-dev.txt
    
    - name: Check Rust formatting
      run: |
        cargo fmt --all -- --check
    
    - name: Run clippy
      run: |
        cargo clippy -- -D warnings
    
    - name: Build and install
      run: |
        python -m venv .venv
        source .venv/bin/activate
        maturin build --release
        pip install target/wheels/*.whl
    
    - name: Run tests
      run: |
        pytest -v tests/
    
    - name: Check Python formatting
      run: |
        black --check .
        ruff check .
    
    - name: Security audit
      uses: rustsec/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  benchmark:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "pikahttp-deps"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin requests
    
    - name: Build and install
      run: |
        python -m venv .venv
        source .venv/bin/activate
        maturin build --release
        pip install target/wheels/*.whl
    
    - name: Run benchmark
      run: |
        python benchmark.py