[package]
name = "pikahttp"
version = "0.1.1"
edition = "2021"

[lib]
name = "pikahttp"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
once_cell = "1.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
hyper = { version = "1.7", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.17", features = ["client", "http1", "http2", "tokio"] }
hyper-tls = "0.6"
bytes = "1"
http-body-util = "0.1"

